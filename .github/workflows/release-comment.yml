name: Comment on released issues and PRs

on:
  release:
    types: [published]

permissions: {}

jobs:
  release:
    name: Comment on released issues and PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the release script
      issues: write # post the release comment on closed issues
      pull-requests: write # post the release comment on merged pull requests
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Comment on released issues and pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        shell: bash
        run: bash .github/scripts/comment-release-targets.sh
