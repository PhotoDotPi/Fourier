services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: fourier-lavalink
    restart: unless-stopped
    ports:
      - "2333:2333"
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    environment:
      - _JAVA_OPTIONS=-Xmx512M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:2333/version"]
      interval: 30s
      timeout: 10s
      retries: 5