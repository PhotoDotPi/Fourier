name: PR Title

# `pull_request_target` is required so the check runs from the base branch and cannot be
# modified by the pull request under test. This workflow never checks out pull request code.
# See .github/zizmor.yml.
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions: {}

jobs:
  lint:
    name: Validate PR title
    if: github.repository == 'PhotoDotPi/Fourier'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # read the pull request title
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            deps
            revert
          scopes: |
            playback
            player
            queue
            commands
            favorites
            panel
            providers
            youtube
            spotify
            db
            migrations
            cache
            voice
            config
            ui
            ci
            deps
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject must start with a lowercase letter, for example
            "fix(player): skip unplayable tracks instead of stalling".
